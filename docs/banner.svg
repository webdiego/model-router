      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="398" rx="19" fill="none" stroke="#3b4261" stroke-width="2"/>

